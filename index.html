<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Time Machine: Debug the Past</title>
<style>
  :root{
    --bg: #0a0d13;
    --bg2: #0e1219;
    --panel: #131822;
    --panel-hi: #171d2a;
    --border: #232b3a;
    --text: #e7ecf3;
    --muted: #7c8699;
    --good: #3ddc84;
    --bad: #ff5d6c;
    --font-display: 'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
    --font-mono: 'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
    --accent: #4af626;
    --accent-dim: #1f6b12;
    --accent-soft: rgba(74,246,38,0.12);
    --scan-op: 0.10;
  }
  body.era-2{ --accent: #ffb000; --accent-dim: #7a5400; --accent-soft: rgba(255,176,0,0.12); --scan-op: 0.07; }
  body.era-3{ --accent: #8f6bff; --accent-dim: #4b2e99; --accent-soft: rgba(143,107,255,0.14); --scan-op: 0.045; }
  body.era-4{ --accent: #5b9bef; --accent-dim: #274a80; --accent-soft: rgba(91,155,239,0.12); --scan-op: 0.0; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 60%);
    color: var(--text); font-family: var(--font-display);
    min-height:100vh; overflow-x:hidden; transition: background 0.8s ease;
  }
  .scanlines{
    pointer-events:none; position:fixed; inset:0; z-index:50;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 1px, transparent 1px, transparent 3px);
    opacity: var(--scan-op); mix-blend-mode: overlay; transition: opacity 0.8s ease;
  }
  .vignette{ pointer-events:none; position:fixed; inset:0; z-index:49; box-shadow: inset 0 0 180px rgba(0,0,0,0.55); }
  #app{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding: 28px 20px 60px; }

  .timeline-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 30px; gap: 8px; }
  .timeline-track{ position:relative; flex:1; height:2px; background: var(--border); margin: 0 6px; }
  .timeline-track::before{ content:""; position:absolute; left:0; top:0; height:100%; width: var(--progress, 0%); background: var(--accent); transition: width 0.6s ease, background 0.6s ease; }
  .era-node{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; }
  .era-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border); background: var(--panel); transition: all 0.4s ease; }
  .era-node.done .era-dot{ background: var(--accent); border-color: var(--accent); }
  .era-node.active .era-dot{ background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow: 0 0 0 4px var(--accent-soft);} 50%{ box-shadow: 0 0 0 8px transparent;} }
  .era-label{ font-size:10.5px; letter-spacing:0.06em; color:var(--muted); font-family: var(--font-mono); text-align:center; text-transform:uppercase; }
  .era-node.active .era-label, .era-node.done .era-label{ color: var(--text); }

  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
  .brand h1{ font-size: 20px; margin:0; letter-spacing:0.02em; }
  .brand h1 span{ color: var(--accent); }
  .brand .score{ font-family: var(--font-mono); font-size:13px; color: var(--muted); background: var(--panel); border:1px solid var(--border); padding:6px 12px; border-radius:8px; }
  .brand .score b{ color: var(--accent); }

  .card{ background: var(--panel); border:1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom:18px; }
  .eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color: var(--accent); margin-bottom:8px; }
  h2{ font-size: 24px; margin: 0 0 12px; }
  p.lead{ color: var(--muted); line-height:1.6; font-size:15px; }
  .btn{
    font-family: var(--font-display); font-weight:600; font-size:14px; cursor:pointer;
    background: var(--accent); color:#0a0d13; border:none; border-radius:9px; padding:12px 22px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn:hover{ filter:brightness(1.08); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn.secondary{ background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover{ border-color: var(--accent); color: var(--accent); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top: 18px; }

  .tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tab{ font-family: var(--font-mono); font-size:12.5px; padding:9px 14px; border-radius:8px; background: var(--panel); border:1px solid var(--border); color:var(--muted); cursor:pointer; }
  .tab.active{ color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight:600; }

  .version-row{ display:grid; grid-template-columns: 96px 1fr 90px; gap: 14px; padding: 13px 4px; border-bottom:1px solid var(--border); align-items:start; }
  .version-row:last-child{ border-bottom:none; }
  .version-id{ font-family: var(--font-mono); color: var(--accent); font-weight:700; font-size:13px; }
  .version-desc{ font-size:14px; line-height:1.5; }
  .version-date{ font-family: var(--font-mono); font-size:11px; color: var(--muted); text-align:right; }
  .tag{ display:inline-block; font-family: var(--font-mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; padding:2px 7px; border-radius:5px; margin-top:6px; border:1px solid var(--border); color:var(--muted); }
  .tag.feature{ color:#5b9bef; border-color:#274a80; }
  .tag.refactor{ color:#ffb000; border-color:#7a5400; }
  .tag.fix{ color:#3ddc84; border-color:#175c3a; }
  .tag.chore{ color:#9aa4b8; }
  .tag.ai{ color:#8f6bff; border-color:#4b2e99; }

  .ticket{ padding:14px; border:1px solid var(--border); border-radius:10px; margin-bottom:10px; background: var(--panel-hi); }
  .ticket-meta{ font-family: var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:6px; }
  .ticket-body{ font-size:14px; line-height:1.5; }

  table.testgrid{ width:100%; border-collapse: collapse; font-size:13px; }
  table.testgrid th, table.testgrid td{ border:1px solid var(--border); padding:9px 8px; text-align:center; }
  table.testgrid th{ font-family: var(--font-mono); font-size:11px; color: var(--muted); background: var(--panel-hi); }
  table.testgrid td.name{ text-align:left; font-size:12.5px; color: var(--text); }
  .pass{ color: var(--good); font-weight:700; }
  .fail{ color: var(--bad); font-weight:700; }
  .test-note{ font-size:11px; color:var(--muted); margin-top:10px; font-style:italic; }

  .accuse-box{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  select{ font-family: var(--font-mono); font-size:13.5px; background: var(--panel-hi); color: var(--text); border:1px solid var(--border); border-radius:8px; padding:11px 14px; min-width:260px; }
  .hint-box{ margin-top:14px; padding:12px 14px; border-left:3px solid var(--accent); background: var(--accent-soft); font-size:13px; border-radius: 0 8px 8px 0; }

  .verdict-banner{ padding: 16px 18px; border-radius:10px; margin-bottom: 16px; font-weight:700; font-size:16px; }
  .verdict-banner.correct{ background: rgba(61,220,132,0.12); color: var(--good); border:1px solid rgba(61,220,132,0.35); }
  .verdict-banner.wrong{ background: rgba(255,93,108,0.12); color: var(--bad); border:1px solid rgba(255,93,108,0.35); }
  .lesson{ margin-top:16px; padding:14px 16px; background: var(--panel-hi); border-radius:10px; border:1px solid var(--border); }
  .lesson .eyebrow{ margin-bottom:6px; }

  .rank-badge{ display:inline-block; font-family: var(--font-mono); font-size:13px; padding:6px 14px; border-radius:20px; background: var(--accent-soft); color: var(--accent); border:1px solid var(--accent-dim); margin-bottom:14px; }
  .stat-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin: 16px 0; }
  .stat{ background: var(--panel-hi); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
  .stat .num{ font-family: var(--font-mono); font-size:24px; color: var(--accent); font-weight:700; }
  .stat .lbl{ font-size:11px; color: var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }

  /* Root Cause Chain (5 Whys) */
  .whys-progress{ display:flex; gap:6px; margin-bottom:16px; }
  .whys-progress .dot{ flex:1; height:4px; border-radius:3px; background: var(--border); }
  .whys-progress .dot.done{ background: var(--accent); }
  .why-q{ font-size:16px; font-weight:600; margin-bottom:14px; }
  .why-options{ display:flex; flex-direction:column; gap:10px; }
  .why-opt{
    text-align:left; padding:13px 16px; border-radius:10px; border:1px solid var(--border);
    background: var(--panel-hi); color: var(--text); cursor:pointer; font-family: var(--font-display); font-size:14px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .why-opt:hover{ border-color: var(--accent); }
  .why-opt.correct-pick{ border-color: var(--good); background: rgba(61,220,132,0.10); }
  .why-opt.wrong-pick{ border-color: var(--bad); background: rgba(255,93,108,0.10); }
  .why-feedback{ margin-top:14px; padding:12px 14px; border-radius:0 8px 8px 0; font-size:13.5px; border-left:3px solid var(--border); background: var(--panel-hi); }
  .why-feedback.ok{ border-left-color: var(--good); }
  .why-feedback.no{ border-left-color: var(--bad); }
  .root-cause-final{ margin-top:18px; padding:16px; border-radius:10px; background: var(--accent-soft); border:1px solid var(--accent-dim); }

  /* Release decision */
  .release-stats{ display:grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin: 14px 0 20px; }
  .release-stats .box{ background: var(--panel-hi); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .release-stats .box .n{ font-family: var(--font-mono); font-size:20px; font-weight:700; }
  .release-stats .box.crit .n{ color: var(--bad); }
  .release-stats .box .l{ font-size:10.5px; color: var(--muted); text-transform:uppercase; margin-top:4px; }
  .release-choices{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .release-choice{ text-align:left; padding:14px 16px; border-radius:10px; border:1px solid var(--border); background: var(--panel-hi); color:var(--text); cursor:pointer; font-family: var(--font-display); font-size:14px; }
  .release-choice:hover{ border-color: var(--accent); }
  .release-choice b{ display:block; margin-bottom:3px; }

  @media (max-width: 620px){
    .version-row{ grid-template-columns: 1fr; }
    .version-date{ text-align:left; }
    select{ min-width: 100%; }
  }

  /* ===== QA Mission Challenge mode ===== */
  .mode-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:16px; }
  .mode-card{ background: var(--panel-hi); border:1px solid var(--border); border-radius:12px; padding:18px; cursor:pointer; transition: border-color 0.15s ease, transform 0.15s ease; }
  .mode-card:hover{ border-color: var(--accent); transform: translateY(-2px); }
  .mode-card .mc-emoji{ font-size:26px; margin-bottom:8px; }
  .mode-card h3{ margin:0 0 6px; font-size:16px; }
  .mode-card p{ margin:0; font-size:12.5px; color: var(--muted); line-height:1.5; }

  .diff-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin: 16px 0; }
  .diff-card{ border-radius:12px; padding:16px; cursor:pointer; border:1px solid var(--border); background: var(--panel-hi); text-align:center; transition: transform 0.15s ease, border-color 0.15s ease; }
  .diff-card:hover{ transform: translateY(-2px); }
  .diff-card.easy{ border-color:#175c3a; }
  .diff-card.easy:hover{ border-color: var(--good); }
  .diff-card.moderate{ border-color:#7a5400; }
  .diff-card.moderate:hover{ border-color:#ffb000; }
  .diff-card.difficult{ border-color:#7a1f2a; }
  .diff-card.difficult:hover{ border-color: var(--bad); }
  .diff-card .emoji{ font-size:22px; }
  .diff-card .lbl{ font-family: var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin-top:6px; }
  .diff-card .xp{ font-size:11px; color: var(--muted); margin-top:4px; }

  .cat-pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 14px 0 4px; }
  .cat-pill{ font-family: var(--font-mono); font-size:11.5px; padding:8px 13px; border-radius:20px; background: var(--panel-hi); border:1px solid var(--border); color: var(--muted); cursor:pointer; }
  .cat-pill.active{ background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight:600; }

  .xp-bar-wrap{ display:flex; align-items:center; gap:10px; font-family: var(--font-mono); font-size:12px; color: var(--muted); }
  .xp-track{ flex:1; height:8px; border-radius:5px; background: var(--panel-hi); border:1px solid var(--border); overflow:hidden; }
  .xp-fill{ height:100%; background: var(--accent); transition: width 0.5s ease; }

  .q-progress{ font-family: var(--font-mono); font-size:11px; color: var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em; }
  .q-category-tag{ display:inline-block; font-family: var(--font-mono); font-size:10px; padding:3px 9px; border-radius:6px; background: var(--accent-soft); color: var(--accent); border:1px solid var(--accent-dim); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.05em; }
  .q-text{ font-size:17px; font-weight:600; margin-bottom:16px; line-height:1.5; }
  .q-options{ display:flex; flex-direction:column; gap:10px; }
  .q-opt{ text-align:left; padding:13px 16px; border-radius:10px; border:1px solid var(--border); background: var(--panel-hi); color: var(--text); cursor:pointer; font-family: var(--font-display); font-size:14px; transition: border-color 0.15s ease, background 0.15s ease; }
  .q-opt:hover{ border-color: var(--accent); }
  .q-opt.correct-pick{ border-color: var(--good); background: rgba(61,220,132,0.10); }
  .q-opt.wrong-pick{ border-color: var(--bad); background: rgba(255,93,108,0.10); }
  .q-opt.reveal-correct{ border-color: var(--good); }
  .q-feedback{ margin-top:14px; padding:12px 14px; border-radius:0 8px 8px 0; font-size:13.5px; border-left:3px solid var(--border); background: var(--panel-hi); }
  .q-feedback.ok{ border-left-color: var(--good); }
  .q-feedback.no{ border-left-color: var(--bad); }
  .xp-toast{ display:inline-block; font-family: var(--font-mono); font-size:12px; font-weight:700; color: var(--accent); background: var(--accent-soft); border:1px solid var(--accent-dim); border-radius:8px; padding:4px 10px; margin-left:8px; }

  .bugrush-timer{ font-family: var(--font-mono); font-size:28px; font-weight:700; text-align:center; color: var(--accent); margin: 4px 0 14px; }
  .bugrush-timer.low{ color: var(--bad); }
</style>
</head>
<body class="era-1">
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="app"></div>

<script>
/* =========================================================
   QA TIME MACHINE: DEBUG THE PAST
   ========================================================= */

const LEVELS = [
{
  era: 1, eraKey: "era-1", eraName: "Junior Tester Era",
  eraTagline: "Manual regression, sharp eyes, no shortcuts.",
  caseTitle: "The Discount Code That Never Worked",
  briefing: "Support is drowning in tickets: customers say their discount codes 'just don't work,' even when typed exactly as emailed. Your job: walk the release log, cross-reference the complaints and the manual test sheet, and name the exact release where this checkout bug was introduced.",
  versions: [
    { id:"v1.0", date:"Jan 03", tag:"feature", desc:"Initial checkout release. Discount code input added to UI, but backend validation is stubbed out (feature flag OFF)." },
    { id:"v1.1", date:"Jan 17", tag:"feature", desc:"Discount validation wired to backend. Basic check: code must be 6-10 characters, any case accepted." },
    { id:"v1.2", date:"Jan 24", tag:"feature", desc:"Added currency selector (USD/EUR/GBP) to checkout summary." },
    { id:"v1.3", date:"Feb 02", tag:"refactor", desc:"Refactored discount validation to a stricter regex supporting alphanumeric codes: ^[A-Z0-9]{6,10}$." },
    { id:"v1.4", date:"Feb 09", tag:"chore", desc:"Copy update: placeholder text changed from 'Code' to 'Enter discount code'." },
    { id:"v1.5", date:"Feb 20", tag:"feature", desc:"Added loyalty points banner above the discount field." }
  ],
  complaints: [
    { meta:"Ticket #4471 — filed Feb 05", body:"\u201cI copy-pasted the code from your email, SAVE10off, and it says invalid. I've tried three times.\u201d" },
    { meta:"Ticket #4483 — filed Feb 06", body:"\u201cMy code worked fine two weeks ago for a friend but now it just won't apply for me.\u201d" },
    { meta:"Ticket #4502 — filed Feb 11", body:"\u201cWhy does the field even say 'Enter discount code' if it doesn't take lowercase letters? Nothing in the email said to use caps.\u201d" }
  ],
  tests: {
    columns: ["v1.0","v1.1","v1.2","v1.3","v1.4","v1.5"],
    rows: [
      { name:"TC-11: Apply valid code, UPPERCASE (SAVE10OFF)", results:["fail","pass","pass","pass","pass","pass"] },
      { name:"TC-12: Apply valid code, lowercase (save10off)", results:["fail","pass","pass","fail","fail","fail"] },
      { name:"TC-13: Apply expired code (shows error)", results:["fail","pass","pass","pass","pass","pass"] }
    ],
    note: "TC-12 is the tell: it passes through v1.1 and v1.2, then flips to fail starting at one specific release and never recovers."
  },
  culprit: "v1.3",
  hint: "Ignore v1.0 — the feature wasn't even live yet, so it can't be where a working feature broke. Find the release where TC-12 flips from pass to fail.",
  explain: {
    correct: "v1.3 tightened the validation regex to ^[A-Z0-9]{6,10}$, which silently rejects any lowercase input. Customers who typed codes exactly as emailed (lowercase) started failing validation from this release onward — confirmed by TC-12 flipping to fail at v1.3 and staying broken through v1.5.",
    wrong: {
      "v1.0": "Too early — the discount feature was stubbed out here, not broken. There's no working behavior yet to regress from.",
      "v1.1": "This is where the feature first works, and TC-12 passes here. The bug hasn't been introduced yet.",
      "v1.2": "A currency selector was added, but the test grid shows TC-12 still passing at v1.2. Nothing here touches validation logic.",
      "v1.4": "This is a copy/placeholder-text change only, filed after the regex refactor. TC-12 was already failing before this release — the copy change is a coincidence, not the cause.",
      "v1.5": "By this point the bug has existed for two releases already. This is a downstream symptom point, not the origin."
    }
  },
  lesson: "Bisection mindset: when a defect exists 'somewhere in history,' don't guess — find the last known-good version and the first known-bad version, then narrow the gap. A test case flipping from pass to fail across a version grid is one of the most reliable ways to pinpoint a regression's true origin.",
  whys: [
    { q: "Why are customers' discount codes being rejected as invalid?", options:[
        "Because the code they typed doesn't pass the checkout page's current validation rule.",
        "Because the discount codes have all expired.",
        "Because the checkout page is down."
      ], correct:0,
      feedback:["Right — TC-13 (expired codes) behaves consistently across every version, so expiry isn't the issue. The failure is specifically about *valid* codes being rejected.",
        "The test grid shows expired-code handling (TC-13) working the same at every version — that's not what changed.",
        "There's no evidence of an outage; the page loads and processes other fields fine."] },
    { q: "Why does the current validation rule reject these specific codes?", options:[
        "Because the validation regex only accepts uppercase letters and digits.",
        "Because the codes are too short.",
        "Because the customer's browser is outdated."
      ], correct:0,
      feedback:["Right — ^[A-Z0-9]{6,10}$ has no lowercase range, so any lowercase input fails the pattern regardless of length.",
        "Length isn't the issue — SAVE10off is within the 6-10 character range; it fails on case, not length.",
        "No browser-specific pattern appears anywhere in the tickets or test data."] },
    { q: "Why does the regex only accept uppercase?", options:[
        "Because v1.3 refactored validation to a stricter case-sensitive pattern.",
        "Because it was always written that way since v1.0.",
        "Because of a typo in the marketing email template."
      ], correct:0,
      feedback:["Right — this is exactly the change introduced at v1.3, replacing the looser v1.1 rule.",
        "v1.1's rule accepted any case — this got stricter later, it wasn't always this way.",
        "The email template isn't part of the codebase under investigation, and tickets show correctly-cased codes still failing."] },
    { q: "Why wasn't this caught before it reached customers?", options:[
        "Because the regression suite only tested uppercase codes, not lowercase input.",
        "Because there was no test suite at all at this stage.",
        "Because the bug only affects one specific customer's account."
      ], correct:0,
      feedback:["Right — TC-11 (uppercase) was covered and always passed, but there was no lowercase equivalent until this investigation, so the gap shipped silently.",
        "A test suite existed (TC-11, TC-12, TC-13) — the gap was in *coverage*, not total absence of testing.",
        "The complaints span multiple unrelated customers, so it isn't account-specific — it's a systemic input-case issue."] }
  ],
  rootCauseStatement: "Root cause: the v1.3 validation refactor introduced an undocumented case-sensitivity requirement, and the regression suite had no lowercase test case to catch it before release."
},
{
  era: 2, eraKey: "era-2", eraName: "Automation Era",
  eraTagline: "CI pipelines, commit diffs, and flaky-looking failures.",
  caseTitle: "The Login Suite That Randomly Falls Apart",
  briefing: "Your smoke test suite for login has become 'flaky' — it passes most runs but fails intermittently in longer CI pipelines. The team is tempted to just add a retry and move on. Read the commit history and CI logs, and name the commit that actually caused this.",
  versions: [
    { id:"c101", date:"Mar 01", tag:"feature", desc:"Add rate limiting to /login endpoint: block requests for 60s after 5 failed attempts from the same IP." },

    { cat:"Bug Investigation", q:"Production users report duplicate payments after checkout. What should QA investigate first?", options:["UI colors","Transaction flow and API requests, especially retry/idempotency handling","User profile pictures","Browser theme"], correct:1, explain:"Duplicate payments are almost always a transaction/idempotency issue — e.g. a retried request creating a second charge — so the transaction flow and API layer are the first place to look." },
    { cat:"Automation Testing", q:"Automation tests pass locally but fail in CI/CD. What should QA check first?", options:["Test environment differences (config, data, timing, dependencies)","The developer's personal computer","The application logo","Random user feedback"], correct:0, explain:"Local-vs-CI discrepancies are almost always environmental: different data seeds, timing/concurrency, missing env vars, or dependency versions." },
    { cat:"Agile & Process", q:"A release has 5000 test cases, 4900 passed, 100 failed — including 1 payment failure and 2 data-loss issues. Should QA approve release?", options:["Yes, pass rate is 98%","No — block release due to critical risk despite a high pass rate","Ignore the bugs and ship","Delete the failing tests so the report looks clean"], correct:1, explain:"Pass-rate percentage doesn't capture severity. A payment failure and data-loss bugs are release-blocking regardless of how good the aggregate numbers look." },
    { cat:"Bug Investigation", q:"A bug can't be reproduced after deployment. What should QA collect before giving up?", options:["Logs, environment details, timestamps, and exact user actions","Developer opinion only","A single screenshot only","Nothing — mark it Cannot Reproduce and close it"], correct:0, explain:"Hard-to-reproduce bugs need corroborating evidence — logs, timestamps, environment/config, and precise user actions — before being written off." },
    { cat:"Agile & Process", q:"A requirement says 'System should be fast.' What should QA do?", options:["Start testing immediately using personal judgment of 'fast'","Push back and ask for measurable, testable performance criteria (e.g. response time under X ms at Y load)","Ignore the requirement entirely","Remove the feature from scope"], correct:1, explain:"Untestable requirements need to be converted into measurable acceptance criteria before meaningful test cases can be designed." },
    { cat:"Security Testing", q:"A penetration test finds that expired session tokens are still accepted by the API. What's the most likely root cause category?", options:["Frontend CSS bug","Server-side session/token validation not properly checking expiry","Missing favicon","Slow database indexing"], correct:1, explain:"If an expired token still authenticates, the server-side validation logic isn't correctly checking expiry — a session-management defect with real security impact." },
    { cat:"Performance Testing", q:"A load test shows response time is fine up to 500 concurrent users, then degrades sharply at 550. What should QA report this as?", options:["A random anomaly, ignore it","A likely capacity/scaling threshold (e.g. connection pool or resource limit) worth investigating before that traffic level is reached in production","Proof the app can never scale","A UI bug"], correct:1, explain:"A sharp knee in the response-time curve typically points to a specific resource limit (DB connections, thread pool, memory) being exhausted — valuable, actionable capacity information." },
    { cat:"Database Testing", q:"After a data migration, row counts match between old and new databases, but some financial totals don't. What should QA check next?", options:["Nothing further — row counts matching is sufficient","Data transformation/mapping logic and precision handling (e.g. rounding, currency conversion) during migration","The UI font size","The server's uptime"], correct:1, explain:"Matching row counts only confirms completeness, not correctness — mismatched totals point to a transformation, rounding, or mapping defect in the migration logic." },
    { cat:"API Testing", q:"An API's documented rate limit is 100 requests/minute, but testing shows it accepts 300 before blocking. What severity would a QA lead most reasonably assign?", options:["Low — cosmetic issue","Medium-to-High — a rate-limiting/security control isn't enforcing as designed, which could enable abuse","Not a bug, it's a feature","Critical UI defect"], correct:1, explain:"Rate limits are often a security/cost control; silently allowing 3x the documented limit is a real enforcement gap, not a minor issue." },
    { cat:"Exploratory Testing", q:"During exploratory testing, you notice an edge case that isn't in any existing test plan and seems risky. What's the best next step?", options:["Ignore it since it's not in the test plan","Log it as a new potential defect/risk with evidence, and consider adding a test case to formalize coverage","Fix the code yourself without telling anyone","Wait until the next major release to mention it"], correct:1, explain:"Exploratory testing exists precisely to surface gaps scripted plans miss — the finding should be documented and fed back into planned coverage." },
    { cat:"Automation Testing", q:"Your team is deciding what to automate first for a new checkout flow. What's generally the best prioritization?", options:["Automate the rarest edge cases first","Automate high-frequency, stable, business-critical paths first (e.g. core checkout success path)","Automate whatever is easiest to script, regardless of value","Automate nothing until 100% of manual cases exist"], correct:1, explain:"Automation ROI is highest on stable, frequently-run, high-value paths — that's where regression protection pays off fastest." },
    { cat:"Bug Investigation", q:"Two different teams report the 'same' bug with slightly different symptoms in different environments. What should QA do first?", options:["Assume they're unrelated and close both","Compare environment, data, and version details across both reports to determine if they share a root cause before merging or splitting the tickets","Merge them immediately without investigation","Assign both randomly to any available engineer"], correct:1, explain:"Symptom differences can come from environment or data differences even when the underlying defect is the same — or they can be genuinely separate bugs. That needs to be verified before merging tickets, not assumed." }
  ]
};

const BONUS_FIRST_TRY = 20;
const BONUS_FAST = 15;

  if(state.screen === 'intro') return renderIntro();
  if(state.screen === 'briefing') return renderBriefing(LEVELS[state.levelIndex]);
  if(state.screen === 'board') return renderBoard(LEVELS[state.levelIndex]);
  if(state.screen === 'verdict') return renderVerdict(LEVELS[state.levelIndex]);
  if(state.screen === 'whys') return renderWhys(LEVELS[state.levelIndex]);
  if(state.screen === 'releaseDecision') return renderReleaseDecision();
  if(state.screen === 'final') return renderFinal();
  if(state.screen === 'modeSelect') return renderModeSelect();
  if(state.screen === 'challengeSetup') return renderChallengeSetup();
  if(state.screen === 'challengeQuestion') return renderChallengeQuestion();
  if(state.screen === 'challengeSummary') return renderChallengeSummary();
  if(state.screen === 'bugRushIntro') return renderBugRushIntro();
  if(state.screen === 'bugRushPlay') return renderBugRushPlay();
  if(state.screen === 'bugRushSummary') return renderBugRushSummary();
}

function timelineBar(){
  let progressPct = 0;
  if(state.screen === 'final'){ progressPct = 100; }
  else { progressPct = (state.levelIndex / 3) * 100; }

  let nodes = LEVELS.map((l,i) => {
    let cls = 'era-node';
    if(state.screen === 'final' || i < state.levelIndex) cls += ' done';
    else if(i === state.levelIndex && state.screen !== 'intro') cls += ' active';
    return `<div class="${cls}"><div class="era-dot"></div><div class="era-label">${l.eraName.replace(' Era','')}</div></div>`;
  }).join('<div class="timeline-track" style="--progress:0%"></div>');

  return `<div class="timeline-bar" style="--progress:${progressPct}%">${nodes}</div>`;
}

function brandBar(){
  return `<div class="brand">
    <h1>QA <span>TIME MACHINE</span></h1>
    <div class="score">SCORE <b>${state.score}</b></div>

}

/* ---------- QA Mission Challenge ---------- */

function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function challengeRank(xp){
  let r = CHALLENGE_RANKS[0];
  for(const c of CHALLENGE_RANKS){ if(xp >= c.min) r = c; }
  return r;
}

function renderChallengeSetup(){
  const cats = ['All', ...CATEGORIES];
  const cat = state.challenge.category;

  app.innerHTML = `
    ${brandBar()}
    <div class="card">
      <div class="eyebrow">QA Mission Challenge</div>
      <h2>Select Your Mission Difficulty</h2>
      <div class="xp-bar-wrap">
        <span>${challengeRank(state.challenge.xp).title}</span>
        <div class="xp-track"><div class="xp-fill" style="width:${Math.min(100, (state.challenge.xp % 400) / 4)}%"></div></div>
        <span>${state.challenge.xp} XP</span>
      </div>
      <p class="lead" style="margin-top:14px;">Optional: filter by category first, then pick a difficulty to begin.</p>
      <div class="cat-pill-row">
        ${cats.map(c => `<div class="cat-pill ${cat===c?'active':''}" onclick="setChallengeCategory('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('')}
      </div>
      <div class="diff-grid">
        <div class="diff-card easy" onclick="beginChallenge('easy')">
          <div class="emoji">🟢</div>
          <div class="lbl">Easy</div>
          <div class="xp">QA Intern / Junior Tester · +10 XP</div>
        </div>
        <div class="diff-card moderate" onclick="beginChallenge('moderate')">
          <div class="emoji">🟡</div>
          <div class="lbl">Moderate</div>
          <div class="xp">QA Engineer · +25 XP</div>
        </div>
        <div class="diff-card difficult" onclick="beginChallenge('difficult')">
          <div class="emoji">🔴</div>
          <div class="lbl">Difficult</div>
          <div class="xp">Senior QA / QA Lead · +50 XP</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn secondary" onclick="state.screen='modeSelect'; render();">Back</button>
      </div>
    </div>
  `;
}

function setChallengeCategory(cat){ state.challenge.category = cat; render(); }

function beginChallenge(difficulty){
  const cat = state.challenge.category;
  let pool = QUESTION_BANK[difficulty];
  if(cat !== 'All') pool = pool.filter(q => q.cat === cat);
  if(pool.length === 0) pool = QUESTION_BANK[difficulty]; // fallback if a category has no questions at this tier

  state.challenge.difficulty = difficulty;
  state.challenge.queue = shuffled(pool);
  state.challenge.index = 0;
  state.challenge.selected = null;
  state.challenge.correctCount = 0;
  state.challenge.totalCount = 0;
  state.challenge.qStartTime = Date.now();
  state.screen = 'challengeQuestion';
  render();
}

function renderChallengeQuestion(){
  const c = state.challenge;
  const q = c.queue[c.index];

  if(!q){ state.screen = 'challengeSummary'; render(); return; }

  const showFeedback = c.selected !== null && c.selected !== undefined;
  const isCorrect = showFeedback && c.selected === q.correct;

  const optionsHtml = q.options.map((opt,i) => {
    let cls = 'q-opt';
    if(showFeedback){
      if(i === q.correct) cls += ' reveal-correct';
      if(i === c.selected && i !== q.correct) cls += ' wrong-pick';
      if(i === c.selected && i === q.correct) cls += ' correct-pick';
    }
    return `<div class="${cls}" onclick="answerChallenge(${i})">${opt}</div>`;
  }).join('');

  let feedbackHtml = '';
  if(showFeedback){
    let xpLine = isCorrect ? `<span class="xp-toast">+${c.lastEarned} XP</span>` : '';
    feedbackHtml = `<div class="q-feedback ${isCorrect?'ok':'no'}">${q.explain}${xpLine}</div>`;
  }

  app.innerHTML = `
    ${brandBar()}
    <div class="card">
      <div class="xp-bar-wrap" style="margin-bottom:14px;">
        <span>${challengeRank(c.xp).title}</span>
        <div class="xp-track"><div class="xp-fill" style="width:${Math.min(100, (c.xp % 400) / 4)}%"></div></div>
        <span>${c.xp} XP</span>
      </div>
      <div class="q-progress">${c.difficulty.toUpperCase()} · Question ${c.index + 1} of ${c.queue.length}</div>
      <div class="q-category-tag">${q.cat}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-options">${optionsHtml}</div>
      ${feedbackHtml}
      <div class="btn-row">
        ${showFeedback ? `<button class="btn" onclick="nextChallengeQuestion()">${c.index === c.queue.length - 1 ? 'Finish Mission' : 'Next Question'}</button>` : ''}
        <button class="btn secondary" onclick="state.screen='challengeSetup'; render();">Exit Mission</button>
      </div>
    </div>
  `;
}

function answerChallenge(i){
  const c = state.challenge;
  const q = c.queue[c.index];
  if(c.selected !== null && c.selected !== undefined) return;
  c.selected = i;
  c.totalCount += 1;
  const correct = i === q.correct;
  const elapsed = Date.now() - c.qStartTime;
  let earned = 0;
  if(correct){
    earned += XP_BY_DIFFICULTY[c.difficulty];
    earned += BONUS_FIRST_TRY;
    if(elapsed <= FAST_THRESHOLD_MS) earned += BONUS_FAST;
    c.correctCount += 1;
  }
  c.lastEarned = earned;
  c.xp += earned;
  render();
}

function nextChallengeQuestion(){
  state.challenge.index += 1;
  state.challenge.selected = null;
  state.challenge.qStartTime = Date.now();
  render();
}

function renderChallengeSummary(){
  const c = state.challenge;
  const rank = challengeRank(c.xp);
  app.innerHTML = `
    ${brandBar()}
    <div class="card">
      <div class="eyebrow">Mission Report</div>
      <h2>${c.difficulty ? c.difficulty[0].toUpperCase()+c.difficulty.slice(1) : ''} Mission Complete</h2>
      <div class="rank-badge">🎖️ RANK: ${rank.title}</div>
      <div class="stat-grid">
        <div class="stat"><div class="num">${c.correctCount}/${c.queue.length}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="num">${c.xp}</div><div class="lbl">Total QA XP</div></div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="state.screen='challengeSetup'; render();">New Mission</button>
        <button class="btn secondary" onclick="state.screen='modeSelect'; render();">Mode Select</button>
      </div>
    </div>
  `;
}

function renderBugRushIntro(){
  app.innerHTML = `
    ${brandBar()}
    <div class="card">

      <p class="lead">Questions are pulled from every difficulty tier at random. Answer fast, answer accurately —
      the clock doesn't stop for anyone.</p>

        <button class="btn" onclick="startBugRush()">Start the Clock</button>
        <button class="btn secondary" onclick="state.screen='modeSelect'; render();">Back</button>
      </div>
    </div>
  `;
}

function startBugRush(){
  if(state.bugRush.timerId) clearInterval(state.bugRush.timerId);
  const allQ = shuffled([...QUESTION_BANK.easy, ...QUESTION_BANK.moderate, ...QUESTION_BANK.difficult]);
  state.bugRush = {
    active: true, timeLeft: 300, timerId: null,
    queue: allQ, index: 0, selected: null,
    correctCount: 0, attempted: 0, xp: 0
  };
  state.screen = 'bugRushPlay';
  render();
  state.bugRush.timerId = setInterval(tickBugRush, 1000);
}

function tickBugRush(){
  state.bugRush.timeLeft -= 1;
  if(state.bugRush.timeLeft <= 0){
    clearInterval(state.bugRush.timerId);
    state.bugRush.active = false;
    state.screen = 'bugRushSummary';
    render();
    return;
  }
  // Only re-render the timer digits, not the whole question, to avoid disrupting a click
  const t = document.getElementById('bugrush-time');
  if(t){
    const m = Math.floor(state.bugRush.timeLeft/60), s = state.bugRush.timeLeft%60;
    t.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    t.className = 'bugrush-timer' + (state.bugRush.timeLeft <= 30 ? ' low' : '');
  }
}

function renderBugRushPlay(){
  const b = state.bugRush;
  if(b.index >= b.queue.length){ b.queue = b.queue.concat(shuffled([...QUESTION_BANK.easy, ...QUESTION_BANK.moderate, ...QUESTION_BANK.difficult])); }
  const q = b.queue[b.index];
  const m = Math.floor(b.timeLeft/60), s = b.timeLeft%60;

  const showFeedback = b.selected !== null && b.selected !== undefined;
  const optionsHtml = q.options.map((opt,i) => {
    let cls = 'q-opt';
    if(showFeedback){
      if(i === q.correct) cls += ' reveal-correct';
      if(i === b.selected && i !== q.correct) cls += ' wrong-pick';
    }
    return `<div class="${cls}" onclick="answerBugRush(${i})">${opt}</div>`;
  }).join('');

  app.innerHTML = `
    ${brandBar()}
    <div class="card">
      <div id="bugrush-time" class="bugrush-timer${b.timeLeft<=30?' low':''}">${m}:${s.toString().padStart(2,'0')}</div>
      <div class="xp-bar-wrap" style="margin-bottom:14px;">
        <span>Correct: ${b.correctCount}/${b.attempted}</span>
        <div class="xp-track"><div class="xp-fill" style="width:${Math.min(100, b.xp/10)}%"></div></div>
        <span>${b.xp} XP</span>
      </div>
      <div class="q-category-tag">${q.cat}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-options">${optionsHtml}</div>
      <div class="btn-row">
        ${showFeedback ? `<button class="btn" onclick="nextBugRush()">Next Bug</button>` : ''}
      </div>
    </div>
  `;
}

function answerBugRush(i){
  const b = state.bugRush;
  if(b.selected !== null && b.selected !== undefined) return;
  const q = b.queue[b.index];
  b.selected = i;
  b.attempted += 1;
  if(i === q.correct){
    b.correctCount += 1;
    b.xp += 50; // "Found Hidden Bug" style bonus pace for rapid mode
  }
  render();
}

function nextBugRush(){
  state.bugRush.index += 1;
  state.bugRush.selected = null;
  render();

function renderBoard(lvl){
  const tabs = ['versions','complaints','tests'];
  const tabLabels = { versions: 'Version Log', complaints: 'Complaints & Signals', tests: 'Test Grid' };

  let tabContent = '';
  if(state.activeTab === 'versions'){
    tabContent = lvl.versions.map(v => `
      <div class="version-row">
        <div class="version-id">${v.id}</div>
        <div><div class="version-desc">${v.desc}</div><span class="tag ${v.tag}">${v.tag}</span></div>
        <div class="version-date">${v.date}</div>

    tabContent = lvl.complaints.map(c => `

      }).join('');
      return `<tr><td class="name">${r.name}</td>${cells}</tr>`;
    }).join('');
    tabContent = `<table class="testgrid">${header}${rows}</table><div class="test-note">${lvl.tests.note}</div>`;

  const options = lvl.versions.map(v => `<option value="${v.id}">${v.id}</option>`).join('');

  if(state.hintUsed[state.levelIndex]){
    hintHtml = `<div class="hint-box"><strong>Hint:</strong> ${lvl.hint}</div>`;

  app.innerHTML = `
    ${brandBar()}
    ${timelineBar()}
    <div class="card">
      <div class="eyebrow">Era ${lvl.era} — ${lvl.caseTitle}</div>
      <div class="tabs">${tabs.map(t => `<div class="tab ${state.activeTab===t?'active':''}" onclick="setTab('${t}')">${tabLabels[t]}</div>`).join('')}</div>
      <div>${tabContent}</div>
    </div>
    <div class="card">
      <div class="eyebrow">Name the Origin</div>
      <p class="lead" style="margin-top:0;">Which version or commit is where this bug was truly introduced?</p>
      <div class="accuse-box">
        <select id="guessSelect">
          <option value="" disabled selected>Select a suspect...</option>
          ${options}
        </select>
        <button class="btn" onclick="submitGuess()">Accuse</button>
        <button class="btn secondary" onclick="useHint()" ${state.hintUsed[state.levelIndex] ? 'disabled' : ''}>${state.hintUsed[state.levelIndex] ? 'Hint Used (-20)' : 'Use Hint (-20 pts)'}</button>
      </div>
      ${hintHtml}
    </div>
  `;
}

function useHint(){
  if(!state.hintUsed[state.levelIndex]){ state.hintUsed[state.levelIndex] = true; state.score = Math.max(0, state.score - 20); }
  render();
}

function submitGuess(){
  const sel = document.getElementById('guessSelect');
  const guess = sel.value;
  if(!guess) return;
  const lvl = LEVELS[state.levelIndex];
  const correct = guess === lvl.culprit;

  if(state.firstTryCorrect[state.levelIndex] === null){
    state.firstTryCorrect[state.levelIndex] = correct;
    if(correct){ state.score += state.hintUsed[state.levelIndex] ? 60 : 100; }
  } else if(!correct){
    state.score = Math.max(0, state.score - 15);
  }

  state.selectedGuess = guess;
  state.lastCorrect = correct;
  state.screen = 'verdict';
  render();
}

function renderVerdict(lvl){
  const correct = state.lastCorrect;
  const guess = state.selectedGuess;
  let explanationText = correct ? lvl.explain.correct : (lvl.explain.wrong[guess] || "That's not the origin point — check the test grid again for where behavior actually flips.");

  app.innerHTML = `
    ${brandBar()}
    ${timelineBar()}
    <div class="card">
      <div class="verdict-banner ${correct ? 'correct' : 'wrong'}">
        ${correct ? `✔ Correct — ${lvl.culprit} is the true origin point.` : `✘ Not quite — ${guess} isn't the root cause.`}
      </div>
      <p class="lead">${explanationText}</p>
      <div class="btn-row">
        ${correct ?
          `<button class="btn" onclick="startWhys()">Trace the Root Cause Chain</button>`
          :
          `<button class="btn" onclick="backToBoard()">Back to Evidence Board</button>`
        }
      </div>
    </div>
  `;
}

function backToBoard(){ state.screen = 'board'; render(); }

function startWhys(){
  state.screen = 'whys';
  state.whysStep = 0;
  state.whysPickedWrong = [];
  state.whysSelected = null;
  render();
}

function renderWhys(lvl){
  const stepIdx = state.whysStep;
  const totalSteps = lvl.whys.length;
  const finished = stepIdx >= totalSteps;

  const dots = Array.from({length: totalSteps}).map((_,i) =>
    `<div class="dot ${i < stepIdx || finished ? 'done' : ''}"></div>`
  ).join('');

  if(finished){
    app.innerHTML = `
      ${brandBar()}
      ${timelineBar()}
      <div class="card">
        <div class="eyebrow">Root Cause Chain — Complete</div>
        <h2>${lvl.caseTitle}</h2>
        <div class="whys-progress">${dots}</div>
        <div class="root-cause-final">
          <div class="eyebrow" style="margin-bottom:8px;">Root Cause Identified</div>
          <div>${lvl.rootCauseStatement}</div>
        </div>
        <div class="lesson">
          <div class="eyebrow">QA Mindset Note</div>
          <div>${lvl.lesson}</div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="finishWhys()">${state.levelIndex === LEVELS.length - 1 ? 'Proceed to Release Decision' : 'Continue to Next Era'}</button>
        </div>
      </div>
    `;
    return;
  }

  const step = lvl.whys[stepIdx];
  const picked = state.whysSelected;
  const showFeedback = picked !== null && picked !== undefined;
  const isCorrectPick = showFeedback && picked === step.correct;

  const optionsHtml = step.options.map((opt, i) => {
    let cls = 'why-opt';
    if(showFeedback && i === picked){ cls += isCorrectPick ? ' correct-pick' : ' wrong-pick'; }
    return `<div class="${cls}" onclick="pickWhy(${i})">${opt}</div>`;
  }).join('');

  let feedbackHtml = '';
  if(showFeedback){
    feedbackHtml = `<div class="why-feedback ${isCorrectPick ? 'ok' : 'no'}">${step.feedback[picked]}</div>`;
  }

  app.innerHTML = `
    ${brandBar()}
    ${timelineBar()}
    <div class="card">
      <div class="eyebrow">Root Cause Chain — Why ${stepIdx + 1} of ${totalSteps}</div>
      <div class="whys-progress">${dots}</div>
      <div class="why-q">${step.q}</div>
      <div class="why-options">${optionsHtml}</div>
      ${feedbackHtml}
      <div class="btn-row">
        ${isCorrectPick ? `<button class="btn" onclick="nextWhyStep()">${stepIdx === totalSteps - 1 ? 'See Root Cause' : 'Next Why'}</button>` : ''}
      </div>
    </div>
  `;
}

function pickWhy(i){
  const lvl = LEVELS[state.levelIndex];
  const step = lvl.whys[state.whysStep];
  state.whysSelected = i;
  if(i !== step.correct){ state.score = Math.max(0, state.score - 5); }
  else { state.score += 15; }
  render();
}

function nextWhyStep(){
  state.whysStep += 1;
  state.whysSelected = null;
  render();
}

function finishWhys(){
  if(state.levelIndex === LEVELS.length - 1){
    state.screen = 'releaseDecision';
  } else {
    state.levelIndex += 1;
    state.screen = 'briefing';
  }
  render();
}

function renderReleaseDecision(){
  const d = RELEASE_DECISION;
  const chosen = state.releaseChoice;

  let choicesHtml = d.choices.map(c => `
    <div class="release-choice" onclick="chooseRelease('${c.id}')">
      <b>${c.label}</b>${c.detail}
    </div>`).join('');

  let feedbackHtml = '';
  if(chosen){
    const choice = d.choices.find(c => c.id === chosen);
    feedbackHtml = `<div class="verdict-banner ${choice.good ? 'correct' : 'wrong'}">${choice.good ? '✔ Defensible call.' : '✘ Risky call.'}</div>
      <p class="lead">${choice.feedback}</p>
      <div class="btn-row"><button class="btn" onclick="goToFinal()">View Final Report</button></div>`;
  }

  app.innerHTML = `
    ${brandBar()}
    ${timelineBar()}
    <div class="card">
      <div class="eyebrow">QA Lead Era — Release Decision</div>
      <h2>Ship It or Hold It?</h2>
      <p class="lead">${d.context}</p>
      <div class="release-stats">
        <div class="box"><div class="n">${d.stats.total.toLocaleString()}</div><div class="l">Total Tests</div></div>
        <div class="box"><div class="n">${d.stats.passed.toLocaleString()}</div><div class="l">Passed</div></div>
        <div class="box"><div class="n">${d.stats.failed}</div><div class="l">Failed</div></div>
        <div class="box crit"><div class="n">${d.stats.critical}</div><div class="l">Critical Bugs</div></div>
        <div class="box"><div class="n">${d.stats.releaseDate}</div><div class="l">Release Date</div></div>
      </div>
      ${!chosen ? `<div class="release-choices">${choicesHtml}</div>` : ''}
      ${feedbackHtml}
    </div>
  `;
}

function chooseRelease(id){
  if(state.releaseChoice) return;
  state.releaseChoice = id;
  const choice = RELEASE_DECISION.choices.find(c => c.id === id);
  state.releaseScore = choice.good ? 100 : 0;
  state.score += state.releaseScore;
  render();
}

function goToFinal(){ state.screen = 'final'; render(); }

function renderFinal(){
  const correctFirstTry = state.firstTryCorrect.filter(Boolean).length;
  const hintsUsed = state.hintUsed.filter(Boolean).length;
  let rank = RANKS[0];
  for(const r of RANKS){ if(correctFirstTry >= r.min) rank = r; }

  const releaseChoice = RELEASE_DECISION.choices.find(c => c.id === state.releaseChoice);
  const releaseLabel = releaseChoice ? (releaseChoice.good ? 'Sound Call' : 'Risky Call') : 'Not Made';

  app.innerHTML = `
    ${brandBar()}
    ${timelineBar()}
    <div class="card">
      <div class="eyebrow">Case Closed</div>
      <h2>Investigation Complete</h2>
      <div class="rank-badge">${rank.emoji} RANK: ${rank.title}</div>
      <p class="lead">${rank.note}</p>
      <div class="stat-grid">
        <div class="stat"><div class="num">${state.score}</div><div class="lbl">Final Score</div></div>
        <div class="stat"><div class="num">${correctFirstTry}/4</div><div class="lbl">First-Try Correct</div></div>
        <div class="stat"><div class="num">${hintsUsed}</div><div class="lbl">Hints Used</div></div>
        <div class="stat"><div class="num">${releaseLabel}</div><div class="lbl">Release Decision</div></div>
      </div>
      <div class="lesson">
        <div class="eyebrow">Across All Four Eras</div>
        <div>Whether you're reading a manual test sheet, a CI dashboard, an AI anomaly flag, or a full postmortem —
        the job is the same: separate <em>where a defect was introduced</em> from <em>where it was noticed</em>,
        <em>how it was reported</em>, and <em>what merely delayed detection</em>. Tools change every era. That
        instinct — and knowing when to hold a release — doesn't.</div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="state.screen='modeSelect'; render();">Try QA Mission Challenge</button>
        <button class="btn secondary" onclick="restartGame()">Play Again</button>
      </div>
    </div>
  `;
}

function restartGame(){
  if(state.bugRush && state.bugRush.timerId) clearInterval(state.bugRush.timerId);
  const prevXp = state.challenge ? state.challenge.xp : 0;
  state = {
    levelIndex: 0, score: 0, activeTab: 'versions',
    hintUsed: [false,false,false,false],
    firstTryCorrect: [null,null,null,null],
    selectedGuess: null, screen: 'intro',
    whysStep: 0, whysPickedWrong: [], releaseChoice: null, releaseScore: 0,
    challenge: { xp: prevXp, difficulty: null, category: 'All', queue: [], index: 0, selected: null, correctCount: 0, totalCount: 0, qStartTime: null, lastEarned: 0 },
    bugRush: { active: false, timeLeft: 300, timerId: null, queue: [], index: 0, selected: null, correctCount: 0, attempted: 0, xp: 0 }
  };
  render();
}

render();
</script>
</body>
</html>
